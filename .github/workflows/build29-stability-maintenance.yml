name: Build 29 Stability Maintenance

on:
  push:
    branches: [ build-29-goat-cam ]
    paths:
      - ".github/build-29-stability.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-29-goat-cam
      - name: Apply Build 29 stability patch
        run: python3 tools/build29_front4k_stability_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/GpuCameraH264Streamer.kt app/src/main/java/com/goatpro/ip/Front4kDirectStreamer.kt app/src/main/java/com/goatpro/ip/MainActivity.kt app/src/main/java/com/goatpro/ip/RtspH264Server.kt
          git diff --cached --quiet || git commit -m "Build 29: estabilizar 4K frontal e desacoplar RTSP"
          git push origin HEAD:build-29-goat-cam
