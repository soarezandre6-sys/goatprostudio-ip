name: Build 30 Front 4K Maintenance

on:
  push:
    branches: [ build-30-goat-cam ]
    paths:
      - ".github/build-30-front4k.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-30-goat-cam
      - name: Apply front 4K patch
        run: python3 tools/build30_front4k_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/Front4kDirectStreamer.kt
          git diff --cached --quiet || git commit -m "Build 30: restaurar 4K frontal e testar Camera1 OEM"
          git push origin HEAD:build-30-goat-cam
