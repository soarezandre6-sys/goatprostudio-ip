name: Build 24 Maintenance

on:
  push:
    branches: [ build-24-goat-cam ]
    paths:
      - ".github/build-24-maintenance.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-24-goat-cam
      - name: Apply Build 24 fixes
        run: python3 tools/build24_fixes.py
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "Build 24: corrigir frontal 4K, presets e segundo plano"
            git push origin HEAD:build-24-goat-cam
          fi
