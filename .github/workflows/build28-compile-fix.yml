name: Build 28 Compile Fix

on:
  push:
    branches: [ build-28-goat-cam ]
    paths:
      - ".github/build-28-compile-fix.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-28-goat-cam
      - name: Apply compile fix
        run: python tools/build28_compile_fix.py
      - name: Commit fix
        run: |
          git config user.name "soarezandre6-sys"
          git config user.email "soarezandre6@gmail.com"
          git add app/src/main/java/com/goatpro/ip/GpuCameraH264Streamer.kt
          git diff --cached --quiet || git commit -m "Build 28: corrigir compilação do pipeline GPU"
          git push origin HEAD:build-28-goat-cam
