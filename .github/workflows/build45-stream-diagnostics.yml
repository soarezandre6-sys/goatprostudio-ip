name: Build 45 Validate Stream Diagnostics

on:
  push:
    branches:
      - build-45-goat-cam
    paths:
      - 'tools/build45_stream_path_diagnostics.py'
      - '.github/workflows/build45-stream-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Build 45 stream diagnostics
        run: python3 tools/build45_stream_path_diagnostics.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Kotlin compile only
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit validated Build 45 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/RtspH264Server.kt \
                  app/src/main/java/com/goatpro/ip/MainActivity.kt \
                  app/src/main/java/com/goatpro/ip/MjpegServer.kt \
                  BUILD_45_STATUS.md
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "Build 45: diagnosticar e aliviar caminho do stream 4K"
            git push origin HEAD:build-45-goat-cam
          fi
