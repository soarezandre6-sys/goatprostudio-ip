name: GOAT CAM Build 41

on:
  push:
    branches: [ build-41-goat-cam ]
    paths:
      - ".github/build-41.trigger"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-41-goat-cam
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply Build 41 patch if needed
        run: |
          if grep -q "direct UHD is RTSP/H.264 only" app/src/main/java/com/goatpro/ip/GpuCameraH264Streamer.kt; then
            echo "Build 41 patch already applied"
          else
            python tools/build41_rtsp_quality_patch.py
          fi
          python tools/build41_compile_fix.py

      - name: Commit Build 41 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/GpuCameraH264Streamer.kt app/src/main/java/com/goatpro/ip/Front4kDirectStreamer.kt app/src/main/java/com/goatpro/ip/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m "Build 41: corrigir compatibilidade Kotlin do ajuste de imagem"
            git push origin HEAD:build-41-goat-cam
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GOAT-CAM-Build-41
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
