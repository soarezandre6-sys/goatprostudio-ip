name: Build 27 FPS 30 Maintenance

on:
  push:
    branches: [ build-27-goat-cam ]
    paths:
      - ".github/build-27-fps30.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FPS 30 default
        run: python tools/build27_fps30_patch.py
      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/MainActivity.kt \
                  app/src/main/java/com/goatpro/ip/Front4kDirectStreamer.kt \
                  BUILD_27_STATUS.md
          git diff --cached --check
          git commit -m "Build 27: usar 30 FPS como padrão seguro"
          git push
