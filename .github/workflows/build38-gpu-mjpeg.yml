name: Build 38 GPU MJPEG

on:
  push:
    branches: [ build-38-goat-cam ]
    paths:
      - ".github/build-38.trigger"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-38-goat-cam
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Build 38 patch
        run: python3 tools/build38_gpu_mjpeg_patch.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/GpuCameraH264Streamer.kt app/src/main/java/com/goatpro/ip/Front4kDirectStreamer.kt
          if ! git diff --cached --quiet; then
            git commit -m "Build 38: MJPEG no fallback GPU 4K frontal"
            git push origin HEAD:build-38-goat-cam
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: goat-cam-build-38-debug
          path: app/build/outputs/apk/debug/app-debug.apk
