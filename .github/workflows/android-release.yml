name: GOAT Cam Release 1.0.0

on:
  workflow_dispatch:
  push:
    branches: [ release-1.0.0-goat-cam ]
    paths:
      - ".github/release-1.0.0.trigger"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate private upload key for GOAT Cam
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          KEYSTORE="$RUNNER_TEMP/GOAT-Cam-upload-key.jks"
          CREDS="$RUNNER_TEMP/GOAT-Cam-signing-credentials.txt"

          keytool -genkeypair             -keystore "$KEYSTORE"             -storetype JKS             -storepass "$PASS"             -keypass "$PASS"             -alias goatcam-upload             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=GOAT Cam, OU=Mobile, O=GOAT PRO Studio, C=BR"

          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$PASS" -alias goatcam-upload | awk -F': ' '/SHA256:/{print $2; exit}')"
          CERT_SHA1="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$PASS" -alias goatcam-upload | awk -F': ' '/SHA1:/{print $2; exit}')"

          {
            echo "GOAT Cam — Chave de upload / assinatura"
            echo "========================================"
            echo "Aplicativo: GOAT Cam"
            echo "Versão inicial de release: 1.0.0"
            echo "Package ID: com.goatpro.ip"
            echo "Alias: goatcam-upload"
            echo "Tipo: JKS / RSA 4096 bits"
            echo
            echo "SENHA DO KEYSTORE / CHAVE:"
            echo "$PASS"
            echo
            echo "SHA-256 do certificado:"
            echo "$CERT_SHA256"
            echo
            echo "SHA-1 do certificado:"
            echo "$CERT_SHA1"
            echo
            echo "IMPORTANTE: guarde este arquivo e o .jks em local privado."
            echo "Não publique a chave nem a senha no GitHub."
          } > "$CREDS"

          echo "GOATCAM_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GOATCAM_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "GOATCAM_KEY_ALIAS=goatcam-upload" >> "$GITHUB_ENV"
          echo "GOATCAM_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "GOATCAM_CREDS_PATH=$CREDS" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release-output/apk-signature-verification.txt
          jarsigner -verify -verbose -certs "$AAB" > release-output/aab-signature-verification.txt
          grep -q "jar verified." release-output/aab-signature-verification.txt

          cp "$APK" release-output/GOAT-Cam-1.0.0-Release.apk
          cp "$AAB" release-output/GOAT-Cam-1.0.0-Play.aab
          sha256sum             release-output/GOAT-Cam-1.0.0-Release.apk             release-output/GOAT-Cam-1.0.0-Play.aab             > release-output/GOAT-Cam-1.0.0-SHA256.txt

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: goat-cam-release-1.0.0
          path: release-output/
          retention-days: 90

      - name: Upload private signing backup
        uses: actions/upload-artifact@v4
        with:
          name: goat-cam-release-1.0.0-signing-backup
          path: |
            ${{ env.GOATCAM_KEYSTORE_PATH }}
            ${{ env.GOATCAM_CREDS_PATH }}
          retention-days: 1
