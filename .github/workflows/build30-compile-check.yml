name: Build 30 Compile Check

on:
  push:
    branches: [ build-30-goat-cam ]
    paths:
      - ".github/build-30-compile.trigger"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace
