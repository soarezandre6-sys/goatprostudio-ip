name: Build 36 Front 4K Native

on:
  push:
    branches: [ build-36-goat-cam ]
    paths:
      - ".github/build-36.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-36-goat-cam
      - name: Apply Build 36 patch
        run: python tools/build36_front4k_native_diag.py
      - name: Commit Build 36 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/Front4kDirectStreamer.kt app/src/main/java/com/goatpro/ip/MainActivity.kt BUILD_36_STATUS.md
          git commit -m "Build 36: forçar 4K nativo no S21 e medir frames" || true
          git push origin HEAD:build-36-goat-cam
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: goat-cam-build-36-debug
          path: app/build/outputs/apk/debug/app-debug.apk
