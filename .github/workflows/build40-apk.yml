name: GOAT CAM Build 40 APK

on:
  push:
    branches: [ build-40-goat-cam ]
    paths:
      - ".github/build-40-apk.trigger"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-40-goat-cam
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GOAT-CAM-Build-40.apk
          sha256sum artifacts/GOAT-CAM-Build-40.apk
      - uses: actions/upload-artifact@v4
        with:
          name: goat-cam-build-40-apk
          path: artifacts/GOAT-CAM-Build-40.apk
          if-no-files-found: error
