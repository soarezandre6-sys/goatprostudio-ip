name: Build 37 IPv6

on:
  push:
    branches: [ build-37-goat-cam ]
    paths:
      - ".github/build-37.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-37-goat-cam
          fetch-depth: 0

      - name: Fix Kotlin IPv6 strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('app/src/main/java/com/goatpro/ip/MainActivity.kt')
          main = main_path.read_text(encoding='utf-8')
          malformed = 'lines.joinToString("' + '\n' + '")'
          count = main.count(malformed)
          if count != 2:
              raise SystemExit(f'Esperava 2 joinToString quebrados, encontrei {count}')
          main = main.replace(malformed, 'lines.joinToString("\\n")')
          main_path.write_text(main, encoding='utf-8')

          rtsp_path = Path('app/src/main/java/com/goatpro/ip/RtspH264Server.kt')
          rtsp = rtsp_path.read_text(encoding='utf-8')
          pattern = r'    private fun buildSdp\(localIp: String\): String \{.*?\n    \}\n\n    private fun respond\('
          replacement = r'''    private fun buildSdp(localIp: String): String {
              val address = NetworkUtils.sdpAddress(localIp)
              val family = if (address.contains(':')) "IP6" else "IP4"
              return "v=0\r\n" +
                  "o=- 0 0 IN $family $address\r\n" +
                  "s=GOAT PRO IP H264\r\n" +
                  "c=IN $family $address\r\n" +
                  "t=0 0\r\n" +
                  "a=control:*\r\n" +
                  "m=video 0 RTP/AVP 96\r\n" +
                  "a=rtpmap:96 H264/90000\r\n" +
                  "a=fmtp:96 packetization-mode=1\r\n" +
                  "a=control:trackID=0\r\n"
          }

          private fun respond('''
          rtsp, changed = re.subn(pattern, lambda _: replacement, rtsp, count=1, flags=re.S)
          if changed != 1:
              raise SystemExit(f'Bloco buildSdp nao encontrado: {changed}')
          rtsp_path.write_text(rtsp, encoding='utf-8')
          PY

      - name: Save Kotlin fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/MainActivity.kt app/src/main/java/com/goatpro/ip/RtspH264Server.kt
          if ! git diff --cached --quiet; then
            git commit -m "Build 37: corrigir strings IPv6 Kotlin"
            git push origin HEAD:build-37-goat-cam
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Build 37 APK
        uses: actions/upload-artifact@v4
        with:
          name: goat-cam-build-37-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
