name: Build 39 Fix Compile

on:
  push:
    branches: [ build-39-goat-cam ]
    paths:
      - ".github/build-39-fix.trigger"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-39-goat-cam
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix Boolean early returns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/goatpro/ip/GpuCameraH264Streamer.kt')
          s=p.read_text(encoding='utf-8')
          old='''    private fun captureMjpegFrame(): Boolean {\n        val session = captureSession ?: return\n        val camera = cameraDevice ?: return\n        val reader = mjpegReader ?: return\n        val request = config ?: return\n        val handler = workerHandler ?: return\n'''
          new='''    private fun captureMjpegFrame(): Boolean {\n        val session = captureSession ?: return false\n        val camera = cameraDevice ?: return false\n        val reader = mjpegReader ?: return false\n        val request = config ?: return false\n        val handler = workerHandler ?: return false\n'''
          if old not in s:
              raise SystemExit('Build39 fix: target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/GpuCameraH264Streamer.kt
          if ! git diff --cached --quiet; then
            git commit -m "Build 39: corrigir retorno do MJPEG adaptativo"
            git push origin HEAD:build-39-goat-cam
          fi
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: goat-cam-build-39-debug
          path: app/build/outputs/apk/debug/app-debug.apk
