name: Build 31 Route Maintenance

on:
  push:
    branches: [ build-31-goat-cam ]
    paths:
      - ".github/build-31-route.trigger"

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-31-goat-cam
          fetch-depth: 0
      - name: Apply Camera1 GPU route patch
        run: python tools/build31_front4k_route_patch.py
      - name: Commit route patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/Front4kDirectStreamer.kt
          git diff --cached --quiet || git commit -m "Build 31: use Camera1 GPU path for front 4K"
          git push origin build-31-goat-cam
