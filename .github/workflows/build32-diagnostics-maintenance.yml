name: Build 32 Diagnostics Maintenance

on:
  push:
    branches: [ build-32-goat-cam ]
    paths:
      - ".github/build-32-diagnostics.trigger"

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-32-goat-cam
          fetch-depth: 0
      - name: Apply Build 32 diagnostics patch
        run: python tools/build32_diagnostics_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/Camera1GpuH264Streamer.kt app/src/main/java/com/goatpro/ip/RtspH264Server.kt
          git commit -m "Build 32: RTSP assíncrono e diagnóstico de travamento" || exit 0
          git push origin build-32-goat-cam
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace
