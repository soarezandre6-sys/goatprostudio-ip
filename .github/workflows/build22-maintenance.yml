name: Build 22 Maintenance

on:
  push:
    branches: [ build-22-goat-cam ]
    paths:
      - ".github/build-22-maintenance.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-22-goat-cam
      - name: Apply Build 22 source update
        run: python3 tools/build22_cleanup.py
      - name: Commit Build 22 source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed; validation passed."
          else
            git commit -m "Build 22: remover 8K e integrar 4K frontal"
            git push origin HEAD:build-22-goat-cam
          fi
