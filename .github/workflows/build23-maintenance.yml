name: Build 23 Maintenance

on:
  push:
    branches: [ build-23-goat-cam ]
    paths:
      - ".github/build-23-maintenance.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-23-goat-cam
      - name: Apply Build 23 source update
        run: python3 tools/build23_features.py
      - name: Commit Build 23 source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "Build 23: integrar recursos Pro para teste"
            git push origin HEAD:build-23-goat-cam
          fi
