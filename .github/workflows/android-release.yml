name: GOAT Cam Release 1.0.0

on:
  workflow_dispatch:
  push:
    branches: [ release-1.0.0-goat-cam ]
    paths:
      - ".github/release-1.0.0.trigger"

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
      - name: Upload unsigned release outputs
        uses: actions/upload-artifact@v4
        with:
          name: goat-cam-release-1.0.0-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
