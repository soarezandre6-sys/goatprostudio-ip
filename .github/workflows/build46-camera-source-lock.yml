name: Build 46 Validate Camera Source Lock

on:
  push:
    branches: [ build-46-goat-cam ]
    paths:
      - 'tools/build46_camera_source_lock.py'
      - '.github/workflows/build46-camera-source-lock.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-46-goat-cam
          fetch-depth: 0

      - name: Apply Build 46 camera source lock
        run: python3 tools/build46_camera_source_lock.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Kotlin compile only
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Commit validated Build 46 code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/goatpro/ip/MainActivity.kt
          if git diff --cached --quiet; then
            echo 'No code changes to commit'
          else
            git commit -m 'Build 46: impedir mistura entre cameras'
            git push origin HEAD:build-46-goat-cam
          fi
