name: Build 34 Front 4K MJPEG

on:
  push:
    branches: [ build-34-goat-cam ]
    paths:
      - ".github/build-34.trigger"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-34-goat-cam
          fetch-depth: 0
      - name: Apply Build 34 patch
        run: python tools/build34_front4k_mjpeg_patch.py
      - name: Commit Build 34 code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/goatpro/ip/MjpegServer.kt app/src/main/java/com/goatpro/ip/Camera1GpuH264Streamer.kt app/src/main/java/com/goatpro/ip/Front4kDirectStreamer.kt app/src/main/java/com/goatpro/ip/MainActivity.kt
          git diff --cached --quiet || git commit -m "Build 34: corrigir MJPEG 4K frontal"
          git push origin HEAD:build-34-goat-cam
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: goat-cam-build-34-debug
          path: app/build/outputs/apk/debug/app-debug.apk
